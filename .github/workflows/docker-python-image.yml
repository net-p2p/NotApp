name: Docker Build Multi-version (Python)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: '生成多版本'
        required: false
        default: '3.9-3.13'
        type: string
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/notpython
  DOCKERFILE_DIR: NotPythonApp
  Max_Version: '3.13'

jobs:
  build-multi-version:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python_version: [
          '3.9', '3.9-alpine',
          '3.10', '3.10-alpine',
          '3.11', '3.11-alpine',
          '3.12', '3.12-alpine',
          '3.13', '3.13-alpine'
        ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          VERSION=${{ matrix.python_version }}
          echo "TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          VERSION=${{ matrix.python_version }}

          docker build \
            --build-arg PYTHON_VERSION=$VERSION \
            -t ${{ steps.tags.outputs.TAGS }} \
            ${{ env.DOCKERFILE_DIR }}

      - name: Push Docker image
        if: github.event.inputs.push == 'true'
        run: |
          docker push ${{ steps.tags.outputs.TAGS }}
