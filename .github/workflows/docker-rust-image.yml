name: Docker Build Multi-version (Rust)

on:
  workflow_dispatch:  # 手动触发
    inputs:
      versions:
        description: '生成多版本'
        required: false
        default: 'alpine'
        type: string
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/notrust
  DOCKERFILE_DIR: NotRustApp
  Max_Version: 'alpine'

jobs:
  build-multi-version:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        rust_base: ['alpine']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          VERSION=${{ matrix.rust_base }}
          echo "TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          VERSION=${{ matrix.rust_base }}

          # 使用ARG传递基础镜像类型
          docker build \
            --build-arg RUST_BASE=$VERSION \
            -t ${{ steps.tags.outputs.TAGS }} \
            ${{ env.DOCKERFILE_DIR }}

      - name: Push Docker image
        if: github.event.inputs.push == 'true'
        run: |
          # 推送版本标签
          docker push ${{ steps.tags.outputs.TAGS }}
