name: Docker Build Multi-version (Ruby)

on:
  workflow_dispatch:  # 手动触发
    inputs:
      versions:
        description: '生成多版本'
        required: false
        default: '3.1-3.4'
        type: string
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/notruby
  DOCKERFILE_DIR: NotRubyApp
  Max_Version: '3.4'

jobs:
  build-multi-version:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        ruby_version: [
          '3.1', '3.1-alpine',
          '3.2', '3.2-alpine',
          '3.3', '3.3-alpine',
          '3.4', '3.4-alpine'
        ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          VERSION=${{ matrix.ruby_version }}
          echo "TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          VERSION=${{ matrix.ruby_version }}

          # 使用ARG传递Ruby版本
          docker build \
            --build-arg RUBY_VERSION=$VERSION \
            -t ${{ steps.tags.outputs.TAGS }} \
            ${{ env.DOCKERFILE_DIR }}

      - name: Push Docker image
        if: github.event.inputs.push == 'true'
        run: |
          # 推送版本标签
          docker push ${{ steps.tags.outputs.TAGS }}
